[package]
name = "focusflow"
version = "2.0.0"
edition = "2021"
authors = ["aloneangel45 <https://github.com/aloneangel45>"]
description = "Kernel-level deep work discipline engine, atomic hosts blocker, and low-overhead process supervisor in Rust."
license = "MIT"
readme = "README.md"
repository = "https://github.com/aloneangel45/FocusFlow"
keywords = ["deepwork", "productivity", "hosts-blocker", "pomodoro", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
colored = "2.1"
indicatif = "0.17"
tempfile = "3.10"
ctrlc = "3.4"

[[bin]]
name = "focusflow"
path = "src/main.rs"

[lib]
name = "focusflow"
path = "src/lib.rs"
